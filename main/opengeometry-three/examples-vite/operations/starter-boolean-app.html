<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Open CAD Starter Boolean App</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Minimal Open CAD starter app that runs one solid boolean subtraction in Three.js."
    />
  </head>
  <body class="og-example-page">
    <div class="og-badge-title-card">
      <a href="../index.html" class="og-badge-title-link">Back</a>
      <span class="og-badge-title">Starter Boolean App</span>
    </div>

    <div id="app"></div>

    <script type="module">
      import "../src/styles/theme.css";
      import * as THREE from "three";
      import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
      import wasmUrl from "../../../opengeometry/pkg/opengeometry_bg.wasm?url";
      import {
        booleanSubtraction,
        Cuboid,
        OpenGeometry,
        Sphere,
        Vector3,
      } from "opengeometry";

      const app = document.getElementById("app");
      if (!app) {
        throw new Error("Missing #app container");
      }

      async function main() {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeef2ff);

        const camera = new THREE.PerspectiveCamera(
          55,
          window.innerWidth / window.innerHeight,
          0.1,
          100
        );
        camera.position.set(11, 6.5, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        app.replaceChildren(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1.2, 0);
        controls.update();

        scene.add(new THREE.GridHelper(30, 30, 0x4460ff, 0xd5ddff));
        scene.add(new THREE.AmbientLight(0xffffff, 0.82));

        const light = new THREE.DirectionalLight(0xffffff, 1.15);
        light.position.set(7, 9, 5);
        scene.add(light);

        await OpenGeometry.create({ wasmURL: wasmUrl });

        const host = new Cuboid({
          center: new Vector3(0, 0.75, 0),
          width: 2.4,
          height: 1.5,
          depth: 1.6,
          color: 0xdc2626,
          outlineWidth: 2,
        });
        host.outline = true;

        const cutter = new Sphere({
          center: new Vector3(0.85, 0.82, 0.2),
          radius: 0.82,
          widthSegments: 28,
          heightSegments: 18,
          color: 0xf97316,
          outlineWidth: 2,
        });
        cutter.outline = true;

        const result = booleanSubtraction(host, cutter, {
          outline: true,
          outlineWidth: 2,
        });

        host.position.x = -4;
        cutter.position.x = -4;
        result.position.x = 4;

        scene.add(host);
        scene.add(cutter);
        scene.add(result);

        renderer.setAnimationLoop(() => {
          controls.update();
          renderer.render(scene, camera);
        });

        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });
      }

      void main();
    </script>
  </body>
</html>
